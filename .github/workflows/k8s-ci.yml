# Builds the workload and security gateway images, stands up an ephemeral `kind` cluster,
# deploys the Helm chart (deploy/helm/selfheal), and runs smoke + resilience
# tests -- entirely on the GitHub-hosted runner. No Docker/Kubernetes tooling
# is ever installed or run on a developer's own machine for this project;
# see CLAUDE.md's "Two layers of self-healing" note in README.md.
#
# Rule learned the hard way in this repo's own release.yml (see CLAUDE.md's
# 2026-09-29 log entry): never put `secrets.*` directly inside an `if:`
# condition anywhere in a workflow -- it isn't a valid named-value there and
# can make the ENTIRE workflow file fail to register (0 jobs scheduled, no
# logs). This workflow has no secrets-gated steps, but keep that rule in
# mind if one is ever added.
name: k8s-ci

on:
  push:
    branches: ["main", "k8s-ci-dev", "security/**"]
  pull_request:
    branches: ["main", "security/**"]

permissions:
  contents: read

concurrency:
  group: k8s-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  k8s:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The workflow builds and runs PR-controlled images. Keep the
          # checkout token out of Git config and all subsequent containers.
          persist-credentials: false

      - name: Build pod images
        run: |
          set -euo pipefail
          docker build -f deploy/docker/Dockerfile.app -t selfheal-app:ci .
          docker build -f deploy/docker/Dockerfile.sentinel -t selfheal-sentinel:ci .
          docker build -f deploy/docker/Dockerfile.mcp -t selfheal-mcp:ci .
          docker build -f deploy/docker/Dockerfile.healer -t selfheal-healer:ci .
          docker build -f deploy/docker/Dockerfile.egress-proxy -t selfheal-egress-proxy:ci .
          docker build -f deploy/docker/Dockerfile.dns-filter -t selfheal-dns-filter:ci .

      - name: Prepare a policy-enforcing kind cluster
        run: |
          set -euo pipefail
          cat > /tmp/kind-config.yaml <<'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          networking:
            disableDefaultCNI: true
            podSubnet: 192.168.0.0/16
          nodes:
            - role: control-plane
          EOF

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          install_only: false
          wait: 120s
          cluster_name: kind
          config: /tmp/kind-config.yaml

      - name: Install Calico CNI for enforcing NetworkPolicy tests
        run: |
          set -euo pipefail
          kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.33.0/manifests/calico.yaml
          kubectl rollout status daemonset/calico-node -n kube-system --timeout=300s
          kubectl wait --for=condition=Ready node --all --timeout=180s

      - name: Load images into kind
        run: |
          set -euo pipefail
          kind load docker-image selfheal-app:ci selfheal-sentinel:ci selfheal-mcp:ci selfheal-healer:ci selfheal-egress-proxy:ci selfheal-dns-filter:ci

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: |
          set -euo pipefail
          DNS_SERVICE_IP=$(kubectl get service kube-dns -n kube-system -o jsonpath='{.spec.clusterIP}')
          DNS_FILTER_IP=10.96.0.53
          helm lint deploy/helm/selfheal \
            --set-string dns.upstreamServiceIP="$DNS_SERVICE_IP" \
            --set-string dns.filterServiceIP="$DNS_FILTER_IP" \
            --set env.mcpAuthToken=ci-only-mcp-token-0123456789abcdef0123456789abcdef

      - name: Helm template (dry-run render, catches templating errors before install)
        run: |
          set -euo pipefail
          DNS_SERVICE_IP=$(kubectl get service kube-dns -n kube-system -o jsonpath='{.spec.clusterIP}')
          DNS_FILTER_IP=10.96.0.53
          helm template selfheal deploy/helm/selfheal \
            --set-string dns.upstreamServiceIP="$DNS_SERVICE_IP" \
            --set-string dns.filterServiceIP="$DNS_FILTER_IP" \
            --set image.tag=ci \
            --set env.mcpAuthToken=ci-only-mcp-token-0123456789abcdef0123456789abcdef \
            > /tmp/rendered.yaml

      - name: Verify production chart omits the long-lived GitHub token
        run: |
          set -euo pipefail
          DNS_SERVICE_IP=$(kubectl get service kube-dns -n kube-system -o jsonpath='{.spec.clusterIP}')
          DNS_FILTER_IP=10.96.0.53
          helm template selfheal deploy/helm/selfheal \
            --set env.environment=production \
            --set-string dns.upstreamServiceIP="$DNS_SERVICE_IP" \
            --set-string dns.filterServiceIP="$DNS_FILTER_IP" \
            --set env.mcpAuthToken=ci-only-mcp-token-0123456789abcdef0123456789abcdef \
            > /tmp/rendered-production.yaml
          if grep -q 'name: GITHUB_TOKEN' /tmp/rendered-production.yaml; then
            echo "production workloads must use GitHub App installation tokens"
            exit 1
          fi
          if grep -A20 '^kind: Secret' /tmp/rendered-production.yaml | grep -q '^  github-token:'; then
            echo "production chart must not create a long-lived GitHub token Secret"
            exit 1
          fi

      - name: Helm install
        run: |
          set -euo pipefail
          DNS_SERVICE_IP=$(kubectl get service kube-dns -n kube-system -o jsonpath='{.spec.clusterIP}')
          DNS_FILTER_IP=10.96.0.53
          if kubectl get services -A -o custom-columns=':spec.clusterIP' --no-headers | grep -Fxq "$DNS_FILTER_IP"; then
            echo "DNS filter Service IP $DNS_FILTER_IP is already allocated"
            exit 1
          fi
          # Do not use --wait here: app readiness depends on the schema made
          # by the post-install migration hook, which Helm runs after waiting
          # for resources. The explicit migration/readiness checks below run
          # once the hook has completed.
          helm install selfheal deploy/helm/selfheal \
            --timeout 10m \
            --set-string dns.upstreamServiceIP="$DNS_SERVICE_IP" \
            --set-string dns.filterServiceIP="$DNS_FILTER_IP" \
            --set image.tag=ci \
            --set env.mcpAuthToken=ci-only-mcp-token-0123456789abcdef0123456789abcdef

      - name: Verify MCP network policy and bearer authentication
        run: |
          set -euo pipefail
          kubectl get networkpolicy selfheal-mcp
          kubectl get networkpolicy selfheal-egress-gateway selfheal-postgres-access
          kubectl get pods -n kube-system -l k8s-app=calico-node -o wide
          HEALER_POD=$(kubectl get pod -l app=selfheal-healer -o jsonpath='{.items[0].metadata.name}')
          test "$(kubectl get networkpolicy selfheal-mcp -o jsonpath='{.spec.ingress[0].from[0].podSelector.matchLabels.app}')" = "selfheal-healer"
          test "$(kubectl get networkpolicy selfheal-mcp -o jsonpath='{.spec.ingress[0].ports[0].port}')" = "8003"
          kubectl exec "$HEALER_POD" -- python -c '
          import os, urllib.error, urllib.request
          url = os.environ["MCP_CLIENT_URL"]
          request = urllib.request.Request(url, data=b"{}", headers={"Content-Type":"application/json"}, method="POST")
          try:
              urllib.request.urlopen(request, timeout=5)
          except urllib.error.HTTPError as exc:
              assert exc.code == 401, f"expected unauthenticated MCP request to return 401, got {exc.code}"
          else:
              raise AssertionError("unauthenticated MCP request unexpectedly succeeded")
          request.add_header("Authorization", "Bearer " + os.environ["MCP_AUTH_TOKEN"])
          try:
              urllib.request.urlopen(request, timeout=5)
          except urllib.error.HTTPError as exc:
              assert exc.code != 401, f"valid MCP bearer token was rejected: {exc.code}"
          print("MCP bearer authentication passed")
          '

          # A pod without the healer label must not reach the MCP pod. This
          # times out only when the CNI enforces the ingress NetworkPolicy;
          # policy object installation alone cannot make this assertion pass.
          kubectl run mcp-policy-probe --image=python:3.12-alpine --restart=Never \
            --labels=app=network-policy-probe --command -- sleep 300
          kubectl wait --for=condition=Ready pod/mcp-policy-probe --timeout=120s
          MCP_IP=$(kubectl get service selfheal-mcp -o jsonpath='{.spec.clusterIP}')
          PROXY_IP=$(kubectl get service selfheal-egress -o jsonpath='{.spec.clusterIP}')
          PG_IP=$(kubectl get service selfheal-postgres -o jsonpath='{.spec.clusterIP}')
          kubectl exec mcp-policy-probe -- env MCP_IP="$MCP_IP" python -c '
          import os, socket
          try:
              socket.create_connection((os.environ["MCP_IP"], 8003), timeout=3)
          except TimeoutError:
              print("NetworkPolicy enforcement passed: unselected pod ingress timed out")
          else:
              raise AssertionError("unselected pod reached MCP despite healer-only ingress policy")
          '
          kubectl exec mcp-policy-probe -- env PROXY_IP="$PROXY_IP" PG_IP="$PG_IP" python -c '
          import os, socket
          for name, address, port in (("egress proxy", os.environ["PROXY_IP"], 3128), ("PostgreSQL", os.environ["PG_IP"], 5432)):
              try:
                  socket.create_connection((address, port), timeout=3)
              except OSError:
                  print(f"NetworkPolicy enforcement passed: unselected pod cannot reach {name}")
              else:
                  raise AssertionError(f"unselected pod reached {name}")
          '

          DNS_SERVICE_IP=$(kubectl get service kube-dns -n kube-system -o jsonpath='{.spec.clusterIP}')
          kubectl exec "$HEALER_POD" -- env CORE_DNS_IP="$DNS_SERVICE_IP" python -c '
          import os, socket, ssl, urllib.error, urllib.request
          assert socket.gethostbyname("selfheal-mcp")
          assert socket.gethostbyname("api.github.com")
          try:
              socket.gethostbyname("example.com")
          except socket.gaierror:
              print("DNS filter passed: unlisted external DNS names are refused")
          else:
              raise AssertionError("cluster DNS resolved an unlisted external hostname")
          try:
              socket.gethostbyname("unlisted.default.svc.cluster.local.")
          except socket.gaierror:
              print("DNS filter passed: unlisted in-cluster services are refused")
          else:
              raise AssertionError("DNS filter resolved an unlisted in-cluster service")
          with urllib.request.urlopen("https://api.github.com", timeout=15) as response:
              assert response.status == 200, f"GitHub API through allowlisted proxy returned {response.status}"
          tls_context = ssl.create_default_context()
          def tunnel_tls(host, server_name):
              proxy = socket.create_connection(("selfheal-egress", 3128), timeout=10)
              proxy.sendall(f"CONNECT {host}:443 HTTP/1.1\r\nHost: {host}:443\r\n\r\n".encode())
              response = bytearray()
              while not response.endswith(b"\r\n\r\n"):
                  response.extend(proxy.recv(1))
                  assert len(response) <= 8192, "oversized CONNECT response"
              assert response.startswith(b"HTTP/1.1 200 "), f"allowlisted endpoint {host} was unreachable: {response!r}"
              return tls_context.wrap_socket(proxy, server_hostname=server_name)
          for host in ("api.anthropic.com", "api.openai.com", "generativelanguage.googleapis.com", "api.groq.com", "openrouter.ai"):
              tls = tunnel_tls(host, host)
              tls.close()
          try:
              tunnel_tls("api.github.com", "example.com")
          except (OSError, ssl.SSLError):
              print("egress gateway passed: TLS SNI cannot escape an allowlisted CONNECT host")
          else:
              raise AssertionError("gateway allowed a non-allowlisted TLS SNI through api.github.com")
          try:
              urllib.request.urlopen("https://example.com", timeout=10)
          except urllib.error.HTTPError as exc:
              assert exc.code == 403, f"unexpected egress denial response: {exc.code}"
          except urllib.error.URLError as exc:
              assert "403 Destination Denied" in str(exc.reason), f"unexpected egress denial: {exc.reason}"
          else:
              raise AssertionError("non-allowlisted external destination was reachable")
          address = socket.getaddrinfo("api.github.com", 443, type=socket.SOCK_STREAM)[0][4][0]
          try:
              socket.create_connection((address, 443), timeout=3)
          except OSError:
              print("NetworkPolicy enforcement passed: healer cannot bypass the domain proxy")
          else:
              raise AssertionError("healer connected directly to the public network")
          packet = b"\x12\x34\x01\x00\x00\x01\x00\x00\x00\x00\x00\x00\x07example\x03com\x00\x00\x01\x00\x01"
          for resolver in (os.environ["CORE_DNS_IP"], "1.1.1.1"):
              dns = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
              dns.settimeout(3)
              dns.sendto(packet, (resolver, 53))
              try:
                  dns.recvfrom(512)
              except TimeoutError:
                  print(f"NetworkPolicy enforcement passed: direct DNS to {resolver} is blocked")
              else:
                  raise AssertionError(f"healer bypassed the DNS filter and queried {resolver}")
              finally:
                  dns.close()
          print("egress gateway allowed GitHub/provider endpoints and blocked unauthorized hosts")
          '
          kubectl delete pod mcp-policy-probe --wait=true

      - name: Wait for the migration Job to complete
        run: |
          set -euo pipefail
          kubectl wait --for=condition=complete job/selfheal-migrate --timeout=180s
          kubectl logs job/selfheal-migrate --tail=100

      - name: Wait for all pods Ready
        run: |
          set -euo pipefail
          kubectl wait --for=condition=Ready pod -l app=selfheal-app --timeout=180s
          kubectl wait --for=condition=Ready pod -l app=selfheal-sentinel --timeout=180s
          kubectl wait --for=condition=Ready pod -l app=selfheal-mcp --timeout=180s
          kubectl wait --for=condition=Ready pod -l app=selfheal-healer --timeout=180s
          kubectl get pods -o wide

      - name: Verify workload credential separation
        run: |
          set -euo pipefail
          APP_POD=$(kubectl get pod -l app=selfheal-app -o jsonpath='{.items[0].metadata.name}')
          SENTINEL_POD=$(kubectl get pod -l app=selfheal-sentinel -o jsonpath='{.items[0].metadata.name}')
          HEALER_POD=$(kubectl get pod -l app=selfheal-healer -o jsonpath='{.items[0].metadata.name}')
          MCP_POD=$(kubectl get pod -l app=selfheal-mcp -o jsonpath='{.items[0].metadata.name}')
          kubectl exec "$APP_POD" -- python -c '
          import asyncio, os
          import asyncpg
          from sqlalchemy.engine import make_url
          forbidden = {"GITHUB_TOKEN", "GITHUB_APP_PRIVATE_KEY", "ANTHROPIC_API_KEY", "MCP_AUTH_TOKEN", "SESSION_SECRET", "ADMIN_PASSWORD_HASH"}
          leaked = forbidden.intersection(os.environ)
          assert not leaked, f"untrusted app pod received trusted credentials: {sorted(leaked)}"
          database_url = make_url(os.environ["DATABASE_URL"])
          assert database_url.database == "selfheal_target_app", "app must use its isolated database"
          assert database_url.username == "selfheal_app", "app must use its restricted database role"
          async def verify_database_boundary():
              connection = await asyncpg.connect(database_url.set(drivername="postgresql").render_as_string(hide_password=False))
              try:
                  privileges = await connection.fetchrow("SELECT r.rolsuper, r.rolcreatedb, r.rolcreaterole FROM pg_roles AS r WHERE r.rolname = current_user")
                  assert tuple(privileges.values()) == (False, False, False), f"target-app database role is privileged: {privileges}"
              finally:
                  await connection.close()
              control_plane_url = database_url.set(database="selfheal")
              try:
                  control_plane = await asyncpg.connect(control_plane_url.set(drivername="postgresql").render_as_string(hide_password=False), timeout=3)
              except asyncpg.PostgresError as exc:
                  assert "permission denied" in str(exc).lower(), f"unexpected control-plane access failure: {type(exc).__name__}"
                  print("untrusted app cannot connect to the control-plane database")
              else:
                  await control_plane.close()
                  raise AssertionError("untrusted app role connected to the control-plane database")
          asyncio.run(verify_database_boundary())
          print("untrusted app has only a non-privileged role in its isolated database")
          '
          kubectl exec "$SENTINEL_POD" -- python -c '
          import os
          forbidden = {"GITHUB_TOKEN", "GITHUB_APP_PRIVATE_KEY", "ANTHROPIC_API_KEY", "MCP_AUTH_TOKEN", "SESSION_SECRET", "ADMIN_PASSWORD_HASH"}
          leaked = forbidden.intersection(os.environ)
          assert not leaked, f"sentinel pod received unrelated credentials: {sorted(leaked)}"
          print("sentinel pod has only its webhook and ingest credentials")
          '
          kubectl exec "$HEALER_POD" -- python -c '
          import os
          assert os.environ.get("GITHUB_TOKEN") == "ci-dummy-token"
          assert "MCP_AUTH_TOKEN" in os.environ
          assert "ANTHROPIC_API_KEY" in os.environ
          print("trusted healer has the credentials required for control-plane operations")
          '
          kubectl exec "$MCP_POD" -- python -c '
          import os
          assert os.environ.get("GITHUB_TOKEN") == "ci-dummy-token"
          assert "MCP_AUTH_TOKEN" in os.environ
          assert "ANTHROPIC_API_KEY" not in os.environ
          print("MCP has GitHub access but no provider credential")
          '
          for POD in "$APP_POD" "$SENTINEL_POD" "$HEALER_POD" "$MCP_POD"; do
            kubectl exec "$POD" -- python -c '
          from pathlib import Path
          token = Path("/var/run/secrets/kubernetes.io/serviceaccount/token")
          assert not token.exists(), "workload received an unnecessary Kubernetes API token"
          '
          done
          echo "workloads have no mounted Kubernetes service-account token"

      - name: Smoke test -- trigger a seeded bug and confirm sentinel captured it
        run: |
          set -euo pipefail
          kubectl port-forward svc/selfheal-app 8001:8001 >/tmp/pf-app.log 2>&1 &
          APP_PF_PID=$!
          sleep 3
          echo "--- GET /healthz ---"
          curl -sf http://127.0.0.1:8001/healthz
          echo
          echo "--- GET /trigger/zero (expected to 500 -- it's the seeded bug) ---"
          curl -s -o /dev/null -w "%{http_code}\n" http://127.0.0.1:8001/trigger/zero || true
          kill $APP_PF_PID || true
          sleep 2

          echo "--- confirming sentinel-pod captured the error, via the real DB ---"
          PG_POD=$(kubectl get pod -l app=selfheal-postgres -o jsonpath='{.items[0].metadata.name}')
          for i in $(seq 1 15); do
            COUNT=$(kubectl exec "$PG_POD" -- env PGPASSWORD=selfheal psql -U selfheal -d selfheal -tA \
              -c "select count(*) from errors where exception_type='ZeroDivisionError';")
            echo "attempt $i: captured ZeroDivisionError rows = $COUNT"
            if [ "$COUNT" -ge "1" ]; then
              echo "SMOKE TEST PASSED: sentinel captured the seeded bug"
              exit 0
            fi
            sleep 3
          done
          echo "SMOKE TEST FAILED: sentinel never recorded the triggered error"
          echo "--- errors table, by exception_type (diagnostic) ---"
          kubectl exec "$PG_POD" -- env PGPASSWORD=selfheal psql -U selfheal -d selfheal -c \
            "select exception_type, count(*) from errors group by exception_type;" || true
          kubectl logs -l app=selfheal-sentinel --tail=200
          exit 1

      - name: Pod-kill recovery test -- app-pod
        run: |
          set -euo pipefail
          OLD_POD=$(kubectl get pod -l app=selfheal-app -o jsonpath='{.items[0].metadata.name}')
          echo "deleting $OLD_POD"
          kubectl delete pod "$OLD_POD"
          kubectl wait --for=condition=Ready pod -l app=selfheal-app --timeout=90s
          NEW_POD=$(kubectl get pod -l app=selfheal-app -o jsonpath='{.items[0].metadata.name}')
          echo "recreated as $NEW_POD"
          if [ "$OLD_POD" = "$NEW_POD" ]; then
            echo "POD-KILL TEST FAILED: same pod name still present"
            exit 1
          fi
          echo "POD-KILL RECOVERY TEST PASSED"

      - name: Liveness/restart test -- sentinel-pod
        run: |
          set -euo pipefail
          # Kill the actual uvicorn process, not PID 1 -- see
          # deploy/docker/kill_process.py's docstring for why `kill -9 1`
          # doesn't work in a container (a real k8s-ci run tried it first
          # and restartCount never moved).
          POD=$(kubectl get pod -l app=selfheal-sentinel -o jsonpath='{.items[0].metadata.name}')
          BEFORE=$(kubectl get pod "$POD" -o jsonpath='{.status.containerStatuses[0].restartCount}')
          echo "restartCount before: $BEFORE"
          # Killing uvicorn necessarily kills the container's PID 1 (the
          # `sh -c` wrapper exits once its foregrounded child dies), which
          # tears down the exec stream out from under `kubectl exec` itself
          # -- so this command legitimately exits non-zero (137) on success,
          # not on failure. `|| true` so `set -e` doesn't abort the step
          # before the actual pass/fail check below (the restartCount
          # comparison) ever runs.
          kubectl exec "$POD" -- python /app/kill_process.py uvicorn || true
          sleep 5
          kubectl wait --for=condition=Ready pod -l app=selfheal-sentinel --timeout=90s
          AFTER=$(kubectl get pod "$POD" -o jsonpath='{.status.containerStatuses[0].restartCount}')
          echo "restartCount after: $AFTER"
          if [ "$AFTER" -le "$BEFORE" ]; then
            echo "LIVENESS/RESTART TEST FAILED: restartCount did not increase"
            exit 1
          fi
          echo "LIVENESS/RESTART TEST PASSED"

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          echo "::group::kubectl get pods -A"
          kubectl get pods -A -o wide || true
          echo "::endgroup::"
          echo "::group::kubectl get events (sorted)"
          kubectl get events --sort-by=.lastTimestamp -A || true
          echo "::endgroup::"
          echo "::group::kubectl describe pods"
          kubectl describe pods || true
          echo "::endgroup::"
          for app in selfheal-app selfheal-sentinel selfheal-mcp selfheal-healer selfheal-postgres; do
            echo "::group::kubectl logs -l app=$app"
            kubectl logs -l app="$app" --tail=500 --all-containers || true
            echo "::endgroup::"
          done
          echo "::group::kubectl logs -l app=selfheal-migrate"
          kubectl logs -l app=selfheal-migrate --tail=200 --all-containers --prefix=true || true
          echo "::endgroup::"
          echo "::group::helm status"
          helm status selfheal || true
          echo "::endgroup::"

      - name: Delete kind cluster
        if: always()
        run: kind delete cluster
