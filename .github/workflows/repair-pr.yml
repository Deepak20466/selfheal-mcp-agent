name: Secure free-model repair PR

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: selfheal-repair-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      vars.SELFHEAL_REPAIR_ENABLED == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    outputs:
      repository: ${{ steps.target.outputs.repository }}
      sha: ${{ steps.target.outputs.sha }}
      base: ${{ steps.target.outputs.base }}
      run_id: ${{ steps.target.outputs.run_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Verify repair enablement, repository allowlist, and failed CI origin
        id: target
        env:
          SELFHEAL_REPAIR_ENABLED: ${{ vars.SELFHEAL_REPAIR_ENABLED }}
        run: python scripts/resolve_repair_target.py

  infer-initial:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          path: control
          persist-credentials: false

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ needs.prepare.outputs.repository }}
          ref: ${{ needs.prepare.outputs.sha }}
          path: target
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Read failed CI logs as bounded untrusted text
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_RUN_ID: ${{ needs.prepare.outputs.run_id }}
        run: |
          set -euo pipefail
          gh run view "$FAILED_RUN_ID" --log-failed | tail -c 16384 > failure-context.txt
          test -s failure-context.txt

      - name: Generate one patch from a currently listed zero-price :free model
        id: infer
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_FREE_MODEL: ${{ vars.OPENROUTER_FREE_MODEL }}
        run: |
          set -euo pipefail
          python control/scripts/openrouter_repair.py \
            --repository target \
            --failure-file failure-context.txt \
            --output-patch patch.diff
          sha256sum patch.diff | cut -d ' ' -f 1 >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: selfheal-patch-initial-${{ github.run_id }}
          path: patch.diff
          if-no-files-found: error
          retention-days: 1

  test-initial:
    needs: [prepare, infer-initial]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      patch_sha256: ${{ steps.test.outputs.patch_sha256 }}
      retryable: ${{ steps.test.outputs.retryable }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          path: control
          persist-credentials: false

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ needs.prepare.outputs.repository }}
          ref: ${{ needs.prepare.outputs.sha }}
          path: target
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: selfheal-patch-initial-${{ github.run_id }}
          path: candidate

      - name: Install OS sandbox on disposable runner
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          bwrap --version

      - name: Verify network, environment, and filesystem isolation
        run: python control/scripts/verify_repair_sandbox.py

      - name: Validate patch and run unittest in a secret-free, network-isolated workspace
        id: test
        run: |
          set -euo pipefail
          python control/scripts/test_repair_patch.py \
            --repository target \
            --patch candidate/patch.diff \
            --report repair-test-report.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: selfheal-test-report-initial-${{ github.run_id }}
          path: repair-test-report.json
          if-no-files-found: ignore
          retention-days: 1

  infer-retry:
    needs: [prepare, test-initial]
    if: >-
      always() && needs.prepare.result == 'success' &&
      needs.test-initial.outputs.retryable == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          path: control
          persist-credentials: false

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ needs.prepare.outputs.repository }}
          ref: ${{ needs.prepare.outputs.sha }}
          path: target
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: selfheal-patch-initial-${{ github.run_id }}
          path: prior-patch

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: selfheal-test-report-initial-${{ github.run_id }}
          path: prior-test

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Read failed CI logs as bounded untrusted text
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_RUN_ID: ${{ needs.prepare.outputs.run_id }}
        run: |
          set -euo pipefail
          gh run view "$FAILED_RUN_ID" --log-failed | tail -c 16384 > failure-context.txt
          test -s failure-context.txt

      - name: Generate at most one free-model correction after regression failure
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_FREE_MODEL: ${{ vars.OPENROUTER_FREE_MODEL }}
        run: |
          set -euo pipefail
          python control/scripts/openrouter_repair.py \
            --repository target \
            --failure-file failure-context.txt \
            --retry-patch prior-patch/patch.diff \
            --retry-failure prior-test/repair-test-report.json \
            --output-patch patch.diff

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: selfheal-patch-retry-${{ github.run_id }}
          path: patch.diff
          if-no-files-found: error
          retention-days: 1

  test-retry:
    needs: [prepare, infer-retry]
    if: needs.infer-retry.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      patch_sha256: ${{ steps.test.outputs.patch_sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          path: control
          persist-credentials: false

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ needs.prepare.outputs.repository }}
          ref: ${{ needs.prepare.outputs.sha }}
          path: target
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: selfheal-patch-retry-${{ github.run_id }}
          path: candidate

      - name: Install OS sandbox on disposable runner
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          bwrap --version

      - name: Verify network, environment, and filesystem isolation
        run: python control/scripts/verify_repair_sandbox.py

      - name: Validate retry patch and run regression suite offline
        id: test
        run: |
          set -euo pipefail
          python control/scripts/test_repair_patch.py \
            --repository target \
            --patch candidate/patch.diff \
            --report repair-test-report.json

  create-repair-pr:
    needs: [prepare, infer-initial, test-initial, infer-retry, test-retry]
    if: >-
      always() && needs.prepare.result == 'success' &&
      (needs.test-initial.result == 'success' || needs.test-retry.result == 'success')
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          path: control
          persist-credentials: false

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ needs.prepare.outputs.repository }}
          ref: ${{ needs.prepare.outputs.sha }}
          path: target
          persist-credentials: false

      - name: Download the exact patch that passed regression tests
        if: needs.test-initial.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: selfheal-patch-initial-${{ github.run_id }}
          path: candidate

      - name: Download the exact retry patch that passed regression tests
        if: needs.test-initial.result != 'success' && needs.test-retry.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: selfheal-patch-retry-${{ github.run_id }}
          path: candidate

      - name: Revalidate tested artifact and prepare review branch without executing target code
        env:
          TARGET_SHA: ${{ needs.prepare.outputs.sha }}
          TARGET_BASE: ${{ needs.prepare.outputs.base }}
          EXPECTED_PATCH_SHA: ${{ needs.test-initial.result == 'success' && needs.test-initial.outputs.patch_sha256 || needs.test-retry.outputs.patch_sha256 }}
        run: |
          set -euo pipefail
          python control/scripts/repair_patch_policy.py \
            --repository target \
            --patch candidate/patch.diff \
            --expected-sha256 "$EXPECTED_PATCH_SHA" \
            --apply
          git -C target config user.name "selfheal-bot"
          git -C target config user.email "selfheal-bot@users.noreply.github.com"
          git -C target switch --create "selfheal/repair-${TARGET_SHA:0:12}-$(sha256sum candidate/patch.diff | cut -c1-12)" "$TARGET_SHA"
          git -C target add --all
          git -C target commit -m "fix: repair failed CI regression"
          echo "REPAIR_BRANCH=$(git -C target branch --show-current)" >> "$GITHUB_ENV"

      - name: Push the review branch and open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ needs.prepare.outputs.repository }}
          TARGET_BASE: ${{ needs.prepare.outputs.base }}
          TARGET_SHA: ${{ needs.prepare.outputs.sha }}
          FAILED_RUN_ID: ${{ needs.prepare.outputs.run_id }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git -C target push origin "HEAD:refs/heads/$REPAIR_BRANCH"
          existing=$(gh pr list --repo "$TARGET_REPOSITORY" --state all --head "$REPAIR_BRANCH" --json url --jq '.[0].url // empty')
          if [ -n "$existing" ]; then
            echo "Existing repair PR: $existing"
            exit 0
          fi
          gh pr create \
            --repo "$TARGET_REPOSITORY" \
            --base "$TARGET_BASE" \
            --head "$REPAIR_BRANCH" \
            --title "[Selfheal] Repair CI failure at ${TARGET_SHA:0:12}" \
            --body "Automated repair proposal from failed CI run https://github.com/$TARGET_REPOSITORY/actions/runs/$FAILED_RUN_ID. The patch passed the configured offline regression suite. Human review is required; this workflow never merges PRs."
