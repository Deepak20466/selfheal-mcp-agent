apiVersion: apps/v1
kind: Deployment
metadata:
  name: selfheal-healer
  labels: {app: selfheal-healer}
spec:
  replicas: 1
  selector:
    matchLabels: {app: selfheal-healer}
  template:
    metadata:
      labels: {app: selfheal-healer}
    spec:
      automountServiceAccountToken: false
      {{- include "selfheal.dnsPodSpec" . | nindent 6 }}
      restartPolicy: Always
      containers:
        - name: healer
          image: {{ include "selfheal.image" (dict "Values" .Values "pod" "healer") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.healer.port }}
          env:
            {{- include "selfheal.commonEnv" . | nindent 12 }}
            {{- include "selfheal.databaseEnv" . | nindent 12 }}
            {{- include "selfheal.githubEnv" . | nindent 12 }}
            {{- include "selfheal.healerEnv" . | nindent 12 }}
            {{- include "selfheal.egressProxyEnv" . | nindent 12 }}
            - name: MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: selfheal-secrets
                  key: mcp-auth-token
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            requests: {{ toYaml .Values.resources.requests | nindent 14 }}
            limits: {{ toYaml .Values.resources.limits | nindent 14 }}
          readinessProbe:
            httpGet: {path: /healthz, port: {{ .Values.healer.port }}}
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}
          livenessProbe:
            httpGet: {path: /healthz, port: {{ .Values.healer.port }}}
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}
---
apiVersion: v1
kind: Service
metadata:
  name: selfheal-healer
spec:
  selector: {app: selfheal-healer}
  ports:
    - port: {{ .Values.healer.port }}
      targetPort: {{ .Values.healer.port }}
